# Cloud Build: imagen Whisper Cita + deploy Jobs promotor y mentor.
#
# Sustituciones obligatorias en el activador:
#   _PROJECT_ID, _SERVICE_ACCOUNT
#
# GPU (default):
#   _USE_GPU=true  → Dockerfile.gpu + Cloud Run Job con nvidia-l4
#   _PARALLELISM=3 (1 GPU por task; limita según cuota del proyecto)
#
# CPU:
#   _USE_GPU=false _DOCKERFILE=Dockerfile _IMAGE_NAME=cita-audio-serialize-whisper
#
# Tablas (una vez):
#   < cr_serialize_cita/bigquery/tables/hist_cita_audio_whisper.sql

substitutions:
  _LOCATION: 'us-central1'
  _SOURCE_DIR: 'cr_serialize_cita/src'
  _DOCKERFILE: 'Dockerfile.gpu'
  _IMAGE_NAME: 'cita-audio-serialize-whisper-gpu'
  _MEMORY: '16Gi'
  _CPU: '8'
  # GPU: Cloud Run limita task-timeout a máximo 3600s (1h)
  _TASK_TIMEOUT: '3600s'
  _MAX_RETRIES: '1'
  _PARALLELISM: '3'
  _WHISPER_MODEL: 'turbo'
  _DATASET: 'raw_cita_promotor'
  _DEPLOY_CANALES: 'promotor,mentor'
  _USE_GPU: 'true'
  _GPU_TYPE: 'nvidia-l4'

timeout: 3600s

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker'
    dir: '${_SOURCE_DIR}'
    args:
      - 'build'
      - '-f'
      - '${_DOCKERFILE}'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:$BUILD_ID'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:latest'
      - '.'

  - id: 'push-latest'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:latest']

  - id: 'push-build-id'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:$BUILD_ID']

  - id: 'deploy-jobs'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - 'cr_serialize_cita/scripts/cloudbuild_deploy.sh'
    env:
      - '_PROJECT_ID=${_PROJECT_ID}'
      - '_SERVICE_ACCOUNT=${_SERVICE_ACCOUNT}'
      - '_LOCATION=${_LOCATION}'
      - '_IMAGE_NAME=${_IMAGE_NAME}'
      - '_IMAGE_TAG=$BUILD_ID'
      - '_MEMORY=${_MEMORY}'
      - '_CPU=${_CPU}'
      - '_TASK_TIMEOUT=${_TASK_TIMEOUT}'
      - '_MAX_RETRIES=${_MAX_RETRIES}'
      - '_PARALLELISM=${_PARALLELISM}'
      - '_WHISPER_MODEL=${_WHISPER_MODEL}'
      - '_DATASET=${_DATASET}'
      - '_DEPLOY_CANALES=${_DEPLOY_CANALES}'
      - '_USE_GPU=${_USE_GPU}'
      - '_GPU_TYPE=${_GPU_TYPE}'

images:
  - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:$BUILD_ID'
  - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:latest'
