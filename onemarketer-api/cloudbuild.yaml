# onemarketer-api → Cloud Function Gen2 (HTTP)
# Reemplaza el recurso desplegado a mano con deploy_gen2_fixed.sh.
#
# Activador Cloud Build — include: onemarketer-api/**
# Variables de sustitución:
#   Obligatorias: _PROJECT_ID, _FUNCTION_NAME, _SERVICE_ACCOUNT, _BUCKET_NAME,
#                 _DATASET_ID, _OAUTH_SECRET
#   Opcionales:   _LOCATION, _REPO_NAME, _MEMORY, _TIMEOUT, _CPU,
#                 _MAX_INSTANCES, _CONCURRENCY, _ALLOW_UNAUTHENTICATED,
#                 _SCHEDULER_NAME, _SERVICE_ACCOUNT_NAME
#
# Descubrir el nombre real en PRD (Cloud Shell):
#   gcloud functions list --project=prd-utpbi-data-operation --gen2 \
#     --filter="name~onemarketer" --format="table(name,state,updateTime)"
#   gcloud scheduler jobs list --project=prd-utpbi-data-operation \
#     --location=us-central1 --filter="name~onemarketer"
#
# Ejemplo (ajusta _FUNCTION_NAME al que ya exista):
#   _FUNCTION_NAME=prd-utpbi-onemarketer-api
#   _OAUTH_SECRET=prd_secret_onemarketer_api
substitutions:
  _LOCATION: 'us-central1'
  _REPO_NAME: 'gcf-artifacts'
  _MEMORY: '512Mi'
  _TIMEOUT: '540s'
  _CPU: '1'
  _MAX_INSTANCES: '10'
  _CONCURRENCY: '1'
  _ALLOW_UNAUTHENTICATED: 'true'
  _SOURCE_DIR: 'onemarketer-api/src'

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - 'onemarketer-api/scripts/cloudbuild_deploy.sh'
    env:
      - '_PROJECT_ID=${_PROJECT_ID}'
      - '_FUNCTION_NAME=${_FUNCTION_NAME}'
      - '_SERVICE_ACCOUNT=${_SERVICE_ACCOUNT}'
      - '_BUCKET_NAME=${_BUCKET_NAME}'
      - '_DATASET_ID=${_DATASET_ID}'
      - '_OAUTH_SECRET=${_OAUTH_SECRET}'
      - '_LOCATION=${_LOCATION}'
      - '_REPO_NAME=${_REPO_NAME}'
      - '_MEMORY=${_MEMORY}'
      - '_TIMEOUT=${_TIMEOUT}'
      - '_CPU=${_CPU}'
      - '_MAX_INSTANCES=${_MAX_INSTANCES}'
      - '_CONCURRENCY=${_CONCURRENCY}'
      - '_ALLOW_UNAUTHENTICATED=${_ALLOW_UNAUTHENTICATED}'
      - '_SOURCE_DIR=${_SOURCE_DIR}'
      - '_SCHEDULER_NAME=${_SCHEDULER_NAME}'
      - '_SERVICE_ACCOUNT_NAME=${_SERVICE_ACCOUNT_NAME}'

options:
  logging: CLOUD_LOGGING_ONLY
