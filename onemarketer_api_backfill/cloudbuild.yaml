# Cloud Run Job: backfill histórico reporteAtenciones (lcra_* desde 2026-06-29).
# Carpeta SEPARADA de onemarketer-api → activador propio, no redespliega el servicio HTTP.
#
# Dockerfile buildea desde la raíz del repo (COPY onemarketer-api/src + entry job).
#
# Activador Cloud Build — include: onemarketer_api_backfill/**
# Variables de sustitución:
#   Obligatorias: _PROJECT_ID, _JOB_NAME, _SERVICE_ACCOUNT, _BUCKET_NAME,
#                 _DATASET_ID, _OAUTH_SECRET
#   Opcionales:   _LOCATION, _REPO_NAME, _IMAGE_NAME, _MEMORY, _CPU,
#                 _TASK_TIMEOUT, _MAX_RETRIES, _BACKFILL_START_DATE,
#                 _BACKFILL_END_DATE, _BACKFILL_TABLES
#
# Ejemplo PRD:
#   _PROJECT_ID=prd-utpbi-data-operation
#   _JOB_NAME=prd-utpbi-onemarketer-api-backfill
#   _SERVICE_ACCOUNT=...@prd-utpbi-data-operation.iam.gserviceaccount.com
#   _BUCKET_NAME=<bucket prd onemarketer>
#   _DATASET_ID=raw_onemarketer
#   _OAUTH_SECRET=prd_secret_onemarketer_api
#   _BACKFILL_START_DATE=2026-06-29
#   _TASK_TIMEOUT=86400s
substitutions:
  _LOCATION: 'us-central1'
  _REPO_NAME: 'gcf-artifacts'
  _IMAGE_NAME: 'onemarketer-api-backfill'
  _MEMORY: '1Gi'
  _CPU: '1'
  _TASK_TIMEOUT: '86400s'
  _MAX_RETRIES: '1'
  _BACKFILL_START_DATE: '2026-06-29'
  _BACKFILL_END_DATE: ''
  _BACKFILL_TABLES: 'reporteAtenciones'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'onemarketer_api_backfill/Dockerfile'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - 'onemarketer_api_backfill/scripts/cloudbuild_deploy.sh'
    env:
      - '_PROJECT_ID=${_PROJECT_ID}'
      - '_JOB_NAME=${_JOB_NAME}'
      - '_SERVICE_ACCOUNT=${_SERVICE_ACCOUNT}'
      - '_BUCKET_NAME=${_BUCKET_NAME}'
      - '_DATASET_ID=${_DATASET_ID}'
      - '_OAUTH_SECRET=${_OAUTH_SECRET}'
      - '_IMAGE=${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '_LOCATION=${_LOCATION}'
      - '_MEMORY=${_MEMORY}'
      - '_CPU=${_CPU}'
      - '_TASK_TIMEOUT=${_TASK_TIMEOUT}'
      - '_MAX_RETRIES=${_MAX_RETRIES}'
      - '_BACKFILL_START_DATE=${_BACKFILL_START_DATE}'
      - '_BACKFILL_END_DATE=${_BACKFILL_END_DATE}'
      - '_BACKFILL_TABLES=${_BACKFILL_TABLES}'

options:
  logging: CLOUD_LOGGING_ONLY
