# =============================================================================
# Cloud Workflows — Pipeline VASO QueeSmart (legado-miss)
# =============================================================================
#
# Orquesta (NO toca tablas STT/analisis de producción):
#   1) Job qs_s3_gap_vaso (gap_prepare + worker) — FLAC listo para STT
#   2) SP consolidate_vaso
#   3) Job qsmart_transcribe (STT Chirp 3 + diarización) → hist_*_whisper_vaso_*
#      (mismas tablas vaso; productor pasa de Whisper a STT API v2)
#   4) SP analisis_ia_vaso (Gemini)
#
# Defaults:
#   job_gap              = prd-utpbi-s3-gap-vaso
#   stt_job_name         = prd-utpbi-qsmart-transcribe
#   stt_manifest_prefix  = state/stt_manifests_vaso
#   manifest             = state/gap_vaso_manifests
#   enriched vaso        = raw_queue_smart.queuesmart_mp3_enriched_vaso
#   hist STT vaso        = adf_speech_analytics.hist_queuesmart_mp3_whisper_vaso_{raw,prd}
#
# Deploy (repo speech_counter — Cloud Build / Cloud Shell):
#   gcloud workflows deploy queuesmart-vaso-pipeline \
#     --source=queuesmart_vaso/workflows/vaso_pipeline.yaml \
#     --location=us-central1 --project=prd-utpbi-data-operation \
#     --service-account=genesys-audio-processor@prd-utpbi-data-operation.iam.gserviceaccount.com
#
# Jobs (Cloud Build, raíz speech_counter):
#   gcloud builds submit --config=qs_s3_gap_vaso/cloudbuild.yaml .
#   gcloud builds submit --config=qsmart_transcribe/cloudbuild.yaml .
#
# Run:
#   gcloud workflows run queuesmart-vaso-pipeline --location=us-central1 \
#     --project=prd-utpbi-data-operation --data='{"process_date":"2026-09-10"}'
# =============================================================================

main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${default(map.get(args, "project_id"), "prd-utpbi-data-operation")}
          - location: ${default(map.get(args, "location"), "us-central1")}
          - bq_location: ${default(map.get(args, "bq_location"), "US")}
          - job_gap: ${default(map.get(args, "job_gap"), "prd-utpbi-s3-gap-vaso")}
          - stt_job_name: ${default(map.get(args, "stt_job_name"), "prd-utpbi-qsmart-transcribe")}
          - stt_manifest_prefix: ${default(map.get(args, "stt_manifest_prefix"), "state/stt_manifests_vaso")}
          - stt_enriched_table: ${default(map.get(args, "stt_enriched_table"), "prd-utpbi-data-operation.raw_queue_smart.queuesmart_mp3_enriched_vaso")}
          - stt_hist_raw_table: ${default(map.get(args, "stt_hist_raw_table"), "prd-utpbi-data-operation.adf_speech_analytics.hist_queuesmart_mp3_whisper_vaso_raw")}
          - stt_hist_prd_table: ${default(map.get(args, "stt_hist_prd_table"), "prd-utpbi-data-operation.adf_speech_analytics.hist_queuesmart_mp3_whisper_vaso_prd")}
          - gcs_bucket: ${default(map.get(args, "gcs_bucket"), "prd-utp-stg-queuesmart")}
          - manifest_prefix: ${default(map.get(args, "manifest_prefix"), "state/gap_vaso_manifests")}
          - max_failed_tasks: ${default(map.get(args, "max_failed_tasks"), -1)}
          - invoke_downstream: ${default(map.get(args, "invoke_downstream"), true)}
          - process_date: ${default(map.get(args, "process_date"), null)}
          - started_at: ${sys.now()}
          - ingest_summary: {}
          - sp_results: {}
          - stt_result: {}
          - stt_count: 0

    - resolve_process_date:
        switch:
          - condition: ${process_date != null}
            next: log_start
          - condition: true
            steps:
              - compute_yesterday:
                  assign:
                    # Lima UTC-5: sys.now()-104400 ≈ ayer calendario Lima
                    - process_date: ${text.substring(time.format(sys.now() - 104400), 0, 10)}

    - log_start:
        call: sys.log
        args:
          severity: INFO
          text: '${"queuesmart VASO pipeline START process_date=" + process_date + " gap=" + job_gap + " stt=" + stt_job_name}'

    # -------------------------------------------------------------------------
    # 1) gap_prepare → manifiesto legado-miss
    # -------------------------------------------------------------------------
    - run_gap_prepare:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: '${"namespaces/" + project_id + "/jobs/" + job_gap}'
          location: ${location}
          body:
            overrides:
              taskCount: 1
              containerOverrides:
                - env:
                    - name: QS_JOB_ROLE
                      value: gap_prepare
                    - name: GAP_TARGET_DATE
                      value: ${process_date}
                    - name: SYNC_PROCESS_DATE
                      value: ${process_date}
                    - name: SYNC_TARGET_DATE
                      value: ${process_date}
          connector_params:
            timeout: 3600
        result: prepare_status

    - normalize_prepare:
        assign:
          - prepare_exec: ${default(map.get(prepare_status, "response"), prepare_status)}
          - prepare_st: ${default(map.get(prepare_exec, "status"), json.decode("{}"))}
          - prepare_failed: ${int(default(map.get(prepare_st, "failedCount"), 0))}
          - prepare_succeeded: ${int(default(map.get(prepare_st, "succeededCount"), 0))}
          - prepare_name: ${default(map.get(default(map.get(prepare_exec, "metadata"), json.decode("{}")), "name"), "n/a")}

    - log_prepare_done:
        call: sys.log
        args:
          severity: INFO
          text: '${"VASO gap_prepare done name=" + string(prepare_name) + " failed=" + string(prepare_failed) + " succeeded=" + string(prepare_succeeded)}'

    - validate_prepare:
        switch:
          - condition: ${prepare_failed > 0}
            steps:
              - raise_prepare:
                  raise:
                    message: "Cloud Run Job gap_prepare vaso falló"
                    failedCount: ${prepare_failed}
          - condition: true
            next: read_manifest_meta

    # -------------------------------------------------------------------------
    # 2) Meta del manifiesto vaso
    # -------------------------------------------------------------------------
    - read_manifest_meta:
        try:
          steps:
            - get_meta:
                call: http.get
                args:
                  url: '${"https://storage.googleapis.com/storage/v1/b/" + gcs_bucket + "/o/" + text.url_encode(manifest_prefix + "/" + process_date + ".meta.json") + "?alt=media"}'
                  auth:
                    type: OAuth2
                result: meta_http
            - parse_meta:
                assign:
                  - manifest_meta: ${meta_http.body}
                  - manifest_count: ${int(default(map.get(manifest_meta, "count"), 0))}
        except:
          as: meta_err
          steps:
            - log_meta_missing:
                call: sys.log
                args:
                  severity: WARNING
                  text: '${"Meta manifiesto vaso no encontrado — count=0: " + string(default(map.get(meta_err, "message"), "n/a"))}'
            - assign_zero:
                assign:
                  - manifest_count: 0

    - log_manifest:
        call: sys.log
        args:
          severity: INFO
          text: '${"VASO manifiesto count=" + string(manifest_count) + " process_date=" + string(process_date)}'

    - maybe_skip_worker:
        switch:
          - condition: ${manifest_count == 0}
            steps:
              - log_empty:
                  call: sys.log
                  args:
                    severity: WARNING
                    text: "VASO manifiesto vacío — se omite worker; se continúa a consolidate/STT/analisis (idempotentes)"
              - assign_empty_ingest:
                  assign:
                    - ingest_summary:
                        manifest_count: 0
                        succeededCount: 0
                        failedCount: 0
                        completionCount: 0
                    - worker_skipped: true
              - after_ingest:
                  next: maybe_run_sps
          - condition: true
            assign:
              - worker_skipped: false
            next: run_worker_job

    # -------------------------------------------------------------------------
    # 3) Worker gap vaso (N tasks)
    # -------------------------------------------------------------------------
    - run_worker_job:
        try:
          steps:
            - call_worker:
                call: googleapis.run.v1.namespaces.jobs.run
                args:
                  name: '${"namespaces/" + project_id + "/jobs/" + job_gap}'
                  location: ${location}
                  body:
                    overrides:
                      taskCount: ${manifest_count}
                      containerOverrides:
                        - env:
                            - name: QS_JOB_ROLE
                              value: worker
                            - name: SYNC_PROCESS_DATE
                              value: ${process_date}
                            - name: SYNC_TARGET_DATE
                              value: ${process_date}
                            - name: GAP_TARGET_DATE
                              value: ${process_date}
                  connector_params:
                    timeout: 14400
                result: worker_status
            - mark_worker_connector_ok:
                assign:
                  - worker_connector_ok: true
        except:
          as: worker_err
          steps:
            - log_worker_connector_err:
                call: sys.log
                args:
                  severity: WARNING
                  text: '${"VASO WORKER OperationError: " + string(default(map.get(worker_err, "message"), "n/a"))}'
            - assign_worker_from_err:
                assign:
                  - worker_connector_ok: false
                  - worker_status: ${default(map.get(worker_err, "operation"), worker_err)}

    - normalize_worker:
        assign:
          - worker_exec: ${default(map.get(worker_status, "response"), worker_status)}
          - worker_st: ${default(map.get(worker_exec, "status"), json.decode("{}"))}
          - succeeded_count: ${int(default(map.get(worker_st, "succeededCount"), 0))}
          - failed_count: ${int(default(map.get(worker_st, "failedCount"), 0))}
          - completion_count: ${int(default(map.get(worker_st, "completionCount"), succeeded_count + failed_count))}
          - worker_name: ${default(map.get(default(map.get(worker_exec, "metadata"), json.decode("{}")), "name"), "")}
          - ingest_summary:
              manifest_count: ${manifest_count}
              succeededCount: ${succeeded_count}
              failedCount: ${failed_count}
              completionCount: ${completion_count}
              execution: ${worker_name}

    - log_worker_result:
        call: sys.log
        args:
          severity: INFO
          text: '${"VASO WORKER done succeeded=" + string(succeeded_count) + " failed=" + string(failed_count) + " of " + string(manifest_count)}'

    - gate_on_failures:
        switch:
          - condition: ${not(default(worker_connector_ok, true)) and failed_count == 0 and succeeded_count == 0}
            steps:
              - raise_worker_unknown:
                  raise:
                    message: "VASO worker falló sin failedCount"
                    error: ${default(worker_status, "n/a")}
          - condition: ${max_failed_tasks >= 0 and failed_count > max_failed_tasks}
            steps:
              - raise_ingest:
                  raise:
                    message: "VASO ingesta parcial: SPs bloqueados"
                    ingest: ${ingest_summary}
          - condition: true
            next: maybe_run_sps

    # -------------------------------------------------------------------------
    # 4) SP consolidate_vaso
    # -------------------------------------------------------------------------
    - maybe_run_sps:
        switch:
          - condition: ${invoke_downstream == false}
            next: finalize
          - condition: true
            next: sp_consolidate_vaso

    - sp_consolidate_vaso:
        steps:
          - log_sp1_start:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_queuesmart_mp3_consolidate_vaso(" + process_date + ")"}'
          - call_sp1:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".raw_queue_smart.sp_queuesmart_mp3_consolidate_vaso`(DATE ''" + process_date + "'');"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  labels:
                    producto: queuesmart-vaso
                    etapa: consolidate
                    servicio: bq
                    pipeline: queuesmart-vaso
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 3600
              result: sp1_job
          - wait_sp1:
              call: sys.sleep
              args:
                seconds: 5
          - poll_sp1:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${sp1_job.jobReference.jobId}
                location: ${bq_location}
              result: sp1_status
          - check_sp1:
              switch:
                - condition: ${sp1_status.status.state == "DONE"}
                  next: sp1_done_check
                - condition: true
                  steps:
                    - sleep_sp1:
                        call: sys.sleep
                        args:
                          seconds: 10
                    - loop_sp1:
                        next: poll_sp1
          - sp1_done_check:
              switch:
                - condition: ${"errorResult" in sp1_status.status}
                  steps:
                    - raise_sp1:
                        raise:
                          message: "sp_queuesmart_mp3_consolidate_vaso falló"
                          error: ${sp1_status.status.errorResult}
                - condition: true
                  steps:
                    - log_sp1_ok:
                        call: sys.log
                        args:
                          severity: INFO
                          text: "SP consolidate_vaso OK"
                    - mark_sp1:
                        assign:
                          - sp_results["consolidate_vaso"]: "ok"

    # -------------------------------------------------------------------------
    # 5) STT Chirp 3 (qsmart_transcribe) — mismo patrón que qs_s3_to_gcs / prod
    #    prepare → meta count → worker N tasks (1 audio / task)
    #    Escribe hist_*_whisper_vaso_* (tablas vaso; no toca gen_ia prod)
    # -------------------------------------------------------------------------
    - run_stt_prepare:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: '${"namespaces/" + project_id + "/jobs/" + stt_job_name}'
          location: ${location}
          body:
            overrides:
              taskCount: 1
              containerOverrides:
                - env:
                    - name: QS_JOB_ROLE
                      value: prepare
                    - name: SYNC_PROCESS_DATE
                      value: ${process_date}
                    - name: SYNC_TARGET_DATE
                      value: ${process_date}
                    - name: QS_ENRICHED_TABLE
                      value: ${stt_enriched_table}
                    - name: QS_HIST_RAW_TABLE
                      value: ${stt_hist_raw_table}
                    - name: QS_HIST_PRD_TABLE
                      value: ${stt_hist_prd_table}
                    - name: QS_MANIFEST_PREFIX
                      value: ${stt_manifest_prefix}
          connector_params:
            timeout: 3600
        result: stt_prepare_status

    - normalize_stt_prepare:
        assign:
          - stt_prepare_exec: ${default(map.get(stt_prepare_status, "response"), stt_prepare_status)}
          - stt_prepare_st: ${default(map.get(stt_prepare_exec, "status"), json.decode("{}"))}
          - stt_prepare_failed: ${int(default(map.get(stt_prepare_st, "failedCount"), 0))}

    - validate_stt_prepare:
        switch:
          - condition: ${stt_prepare_failed > 0}
            steps:
              - raise_stt_prepare:
                  raise:
                    message: "Cloud Run Job STT prepare vaso falló"
                    failedCount: ${stt_prepare_failed}
          - condition: true
            next: read_stt_manifest_meta

    - read_stt_manifest_meta:
        try:
          steps:
            - get_stt_meta:
                call: http.get
                args:
                  url: '${"https://storage.googleapis.com/storage/v1/b/" + gcs_bucket + "/o/" + text.url_encode(stt_manifest_prefix + "/" + process_date + ".meta.json") + "?alt=media"}'
                  auth:
                    type: OAuth2
                result: stt_meta_http
            - parse_stt_meta:
                assign:
                  - stt_meta: ${stt_meta_http.body}
                  - stt_count: ${int(default(map.get(stt_meta, "count"), 0))}
        except:
          as: stt_meta_err
          steps:
            - log_stt_meta_missing:
                call: sys.log
                args:
                  severity: WARNING
                  text: '${"Meta STT vaso no encontrado — count=0: " + string(default(map.get(stt_meta_err, "message"), "n/a"))}'
            - assign_stt_zero:
                assign:
                  - stt_count: 0

    - log_stt_manifest:
        call: sys.log
        args:
          severity: INFO
          text: '${"VASO STT manifiesto count=" + string(stt_count) + " job=" + stt_job_name}'

    - maybe_skip_stt_worker:
        switch:
          - condition: ${stt_count == 0}
            steps:
              - log_stt_empty:
                  call: sys.log
                  args:
                    severity: WARNING
                    text: "VASO STT sin audios — se omite worker; se continúa a analisis"
              - assign_stt_empty:
                  assign:
                    - stt_result:
                        manifest_count: 0
                        succeededCount: 0
                        failedCount: 0
                    - sp_results["stt"]: "skipped_empty"
              - jump_analisis_empty:
                  next: sp_analisis_vaso
          - condition: true
            next: run_stt_worker

    - run_stt_worker:
        try:
          steps:
            - call_stt_worker:
                call: googleapis.run.v1.namespaces.jobs.run
                args:
                  name: '${"namespaces/" + project_id + "/jobs/" + stt_job_name}'
                  location: ${location}
                  body:
                    overrides:
                      taskCount: ${stt_count}
                      containerOverrides:
                        - env:
                            - name: QS_JOB_ROLE
                              value: worker
                            - name: SYNC_PROCESS_DATE
                              value: ${process_date}
                            - name: SYNC_TARGET_DATE
                              value: ${process_date}
                            - name: QS_ENRICHED_TABLE
                              value: ${stt_enriched_table}
                            - name: QS_HIST_RAW_TABLE
                              value: ${stt_hist_raw_table}
                            - name: QS_HIST_PRD_TABLE
                              value: ${stt_hist_prd_table}
                            - name: QS_MANIFEST_PREFIX
                              value: ${stt_manifest_prefix}
                  connector_params:
                    timeout: 86400
                result: stt_worker_status
            - mark_stt_ok:
                assign:
                  - stt_connector_ok: true
        except:
          as: stt_err
          steps:
            - log_stt_err:
                call: sys.log
                args:
                  severity: ERROR
                  text: '${"VASO STT worker falló: " + string(default(map.get(stt_err, "message"), "n/a"))}'
            - raise_stt:
                raise:
                  message: "Cloud Run Job STT vaso falló"
                  error: ${stt_err}

    - normalize_stt_worker:
        assign:
          - stt_exec: ${default(map.get(stt_worker_status, "response"), stt_worker_status)}
          - stt_st: ${default(map.get(stt_exec, "status"), json.decode("{}"))}
          - stt_failed: ${int(default(map.get(stt_st, "failedCount"), 0))}
          - stt_succeeded: ${int(default(map.get(stt_st, "succeededCount"), 0))}
          - stt_result:
              succeededCount: ${stt_succeeded}
              failedCount: ${stt_failed}
              taskCount: ${stt_count}

    - validate_stt_worker:
        switch:
          - condition: ${stt_failed > 0}
            steps:
              - raise_stt_failed:
                  raise:
                    message: "STT vaso failedCount > 0"
                    result: ${stt_result}
          - condition: true
            steps:
              - log_stt_ok:
                  call: sys.log
                  args:
                    severity: INFO
                    text: '${"VASO STT OK succeeded=" + string(stt_succeeded)}'
              - mark_stt:
                  assign:
                    - sp_results["stt"]: "ok"

    # -------------------------------------------------------------------------
    # 6) SP analisis_ia_vaso
    # -------------------------------------------------------------------------
    - sp_analisis_vaso:
        steps:
          - log_sp3_start:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_queuesmart_audio_analisis_ia_vaso(" + process_date + ")"}'
          - call_sp3:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_queuesmart_audio_analisis_ia_vaso`(DATE ''" + process_date + "'', NULL);"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  labels:
                    producto: queuesmart-vaso
                    etapa: gemini
                    servicio: flash-3-5
                    pipeline: queuesmart-vaso
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 14400
              result: sp3_job
          - wait_sp3:
              call: sys.sleep
              args:
                seconds: 5
          - poll_sp3:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${sp3_job.jobReference.jobId}
                location: ${bq_location}
              result: sp3_status
          - check_sp3:
              switch:
                - condition: ${sp3_status.status.state == "DONE"}
                  next: sp3_done_check
                - condition: true
                  steps:
                    - sleep_sp3:
                        call: sys.sleep
                        args:
                          seconds: 15
                    - loop_sp3:
                        next: poll_sp3
          - sp3_done_check:
              switch:
                - condition: ${"errorResult" in sp3_status.status}
                  steps:
                    - raise_sp3:
                        raise:
                          message: "sp_queuesmart_audio_analisis_ia_vaso falló"
                          error: ${sp3_status.status.errorResult}
                - condition: true
                  steps:
                    - log_sp3_ok:
                        call: sys.log
                        args:
                          severity: INFO
                          text: "SP analisis_ia_vaso (Gemini) OK"
                    - mark_sp3:
                        assign:
                          - sp_results["analisis_vaso"]: "ok"

    - finalize:
        assign:
          - ended_at: ${sys.now()}
          - elapsed_seconds: ${ended_at - started_at}
          - summary:
              process_date: ${process_date}
              pipeline: queuesmart-vaso
              ingest: ${ingest_summary}
              stt: ${stt_result}
              sps: ${sp_results}
              invoke_downstream: ${invoke_downstream}
              elapsed_seconds: ${elapsed_seconds}

    - log_summary:
        call: sys.log
        args:
          severity: INFO
          text: '${"queuesmart VASO pipeline OK process_date=" + string(process_date) + " elapsed_s=" + string(elapsed_seconds)}'

    - return_summary:
        return: ${summary}
